<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سيدة تفوحة 🍏</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1565c0;--card:#fff;--ink:#0d3b78;--g:#fff;--gd:#b9d3f5;--bad:#e8590c;--ok:#2f9e44;--blue:#1565c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{min-height:100%;background:#1565c0}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#0b3d91 0%,#1565c0 42%,#42a5f5 100%) fixed;color:var(--ink);font-family:'Tajawal',Tahoma,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:16px;display:flex;flex-direction:column;gap:12px}
.bar{height:14px;background:rgba(255,255,255,.28);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .9s cubic-bezier(.3,.8,.3,1),background-color .9s}
.energy{display:flex;flex-direction:column;gap:5px}.elab{display:flex;justify-content:space-between;color:#fff;font-weight:800;font-size:15px}
#app{transition:opacity .18s ease,transform .18s ease}#app.out{opacity:0;transform:translateY(8px)}
#app>*{animation:rise .45s ease both}#app>*:nth-child(2){animation-delay:.06s}#app>*:nth-child(3){animation-delay:.12s}#app>*:nth-child(4){animation-delay:.18s}#app>*:nth-child(5){animation-delay:.24s}#app>*:nth-child(n+6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#m1{animation:pulse 1.2s ease-in-out infinite}
.cloud{position:relative;margin-top:16px;border-radius:36px;text-align:center}
.cloud::before{content:"";position:absolute;top:-15px;right:56px;width:18px;height:18px;border-radius:50%;background:#fff}
.cloud::after{content:"";position:absolute;top:-25px;right:80px;width:10px;height:10px;border-radius:50%;background:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stage{background:#fff;border-radius:22px;padding:14px;text-align:center;border:3px solid #fff;position:relative}
.stage img{height:230px;max-width:100%;object-fit:contain;animation:pop .35s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.ph{margin:8px auto 0;border:2px dashed #9bb88a;border-radius:12px;color:#5d7a4f;font-size:14px;padding:8px;width:70%}
.say{background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;font-weight:700;border:2px solid #fff;line-height:1.8}
h1{margin:0;font-size:28px;text-align:center;color:#fff}
h2{margin:0;font-size:19px}
.q{background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px}
.opt,.btn{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:14px;padding:14px;cursor:pointer;width:100%;background:#fff;color:var(--blue);box-shadow:0 4px 0 #8fb4e8}
.opt{background:#fff;color:var(--ink);border:2px solid var(--blue);box-shadow:none;text-align:right;margin-top:8px}
.opt:active,.btn:active{transform:translateY(2px)}
.fb{background:#fff;color:var(--ink);padding:12px 14px;border-radius:16px;font-weight:700;line-height:1.7}
.fb.ok{border:4px solid var(--ok)}.fb.no{border:4px solid var(--bad)}
p{margin:0;line-height:1.8}
.pair{display:flex;gap:10px}.pair .stage{flex:1;padding:10px}.pair .stage img{height:150px}.cap{font-weight:800;margin-top:6px;color:var(--ink)}
.sub{text-align:center;color:#fff;font-size:22px}.wait{text-align:center;color:#fff;font-weight:800;font-size:20px}
.room{position:relative;width:min(100%,330px);aspect-ratio:1/1;margin:0 auto;border-radius:22px;border:3px solid #fff;overflow:hidden;background:linear-gradient(to bottom,#faf3e6 0%,#eddcc0 64%,#cdb894 64%,#cdb894 67%,#e0c098 67%,#e0c098 100%)}
.room::before{content:"";position:absolute;left:0;right:0;top:67%;bottom:0;background:repeating-linear-gradient(to bottom,transparent 0 9%,rgba(160,120,80,.3) 9% 10%)}
.room img{position:absolute;transform:translateX(-50%);animation:none;max-width:none}
.pc{flex:1;text-align:center}.pc .cap{color:#fff;font-weight:800;margin-top:6px}
.solo{display:block;margin:0 auto;height:250px;width:auto;max-width:100%;object-fit:contain}.pc .solo{height:170px}
.props{display:flex;gap:10px;justify-content:center;align-items:flex-end;margin-top:8px}.stage .props img{height:90px;width:auto;max-width:32%;object-fit:contain;animation:none}
.opt{display:flex;align-items:center;gap:12px}.opt img{height:76px;width:96px;object-fit:contain;flex:none}.opt span{flex:1}
.menu{display:flex;flex-direction:column;gap:14px}
</style></head><body><div id="app"></div>

function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type,vol,f2){try{var c=ac();if(!c)return;var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.02)}catch(e){}}
function sfx(k){if(k==='click'){tone(660,0,.08,'square',.07,990)}else if(k==='right'){tone(523,0,.12,'sine',.2);tone(659,.1,.12,'sine',.2);tone(784,.2,.25,'sine',.2)}else{tone(220,0,.3,'sawtooth',.12,110);tone(165,.14,.32,'sawtooth',.1,90)}}
function render(h,after){busy=true;A.classList.add('out');setTimeout(function(){A.innerHTML=h;A.classList.remove('out');busy=false;window.scrollTo(0,0);if(after)after()},A.firstChild?190:0)}
function on(el,fn,snd){el.onclick=function(){if(busy)return;ac();if(snd!==false)sfx('click');fn()}}
var PW={glass:20,yogurt:22,cola:28,chips:24,mealBad:36,mealGood:30};
function P(k){return ITEM[k]||IMG[k]}
function L(k,x,w,h,b){return '<img src="'+P(k)+'" alt="" style="left:'+x+'%;bottom:'+b+'%;'+(w?'width:'+w+'%;height:auto':'height:'+h+'%;width:auto')+'">'}
function solo(k){return '<img class="solo" src="'+IMG[k]+'" alt="تفوحة">'}
function stage(img,ph,props){var p=props&&props[0],t=img==='tired'?58:66,h;
 if(img==='scene1')h=L('sun',21,32,0,60)+L('cola',12,19,0,6)+L('cc',51,72,0,13)+L('plates',87,17,0,9)+L('chips',92,11,0,3);
 else if(img==='scene5')h=L('night',22,34,0,60)+L('cc5',61,72,0,12);
 else if(p==='sun')h=L('sun',22,30,0,55)+L(img,64,0,t,9);
 else if(p)h=L(img,34,0,t,9)+L(p,75,PW[p],0,9);
 else h=L(img,50,0,t,9);
 return '<div class="room">'+h+'</div>'}
function en(n){return Math.min(100,10+n*18)}
function hue(v){return 'hsl('+Math.round(v*1.15)+',80%,52%)'}
function bar(v){return '<div class="energy"><div class="elab"><span>⚡ طاقة تفوحة</span><b id="ep">'+v+'%</b></div><div class="bar"><i id="ef" style="width:'+v+'%;background:'+hue(v)+'"></i></div></div>'}
function setEn(v){var f=document.getElementById('ef'),p=document.getElementById('ep');if(!f)return;setTimeout(function(){f.style.width=v+'%';f.style.background=hue(v);p.textContent=v+'%'},60)}
function btn(id,t){return '<button class="btn" id="'+id+'">'+t+'</button>'}
function menu(){render('<h1>ساعد تفوحة في كسب عادات صحية</h1><h2 class="sub">أنقذ تفوحة</h2>'+solo('tired')+'<div class="wait">تفوحة تنتظرك 💚</div><div class="menu">'+btn('m1','العب مباشرة')+btn('m2','تعرّف على تفوحة')+btn('m3','كيف تلعب')+'</div>',function(){
 on(document.getElementById('m1'),start);on(document.getElementById('m2'),about);on(document.getElementById('m3'),how)})}
function about(){render('<h1>تعرّف على تفوحة</h1>'+solo('tired')+'<div class="say">تفوحة شخصية كسولة، أقرب الأشياء إلى قلبها رقائق البطاطا والأريكة المريحة! تحب البيتزا والبرغر والدجاج المقرمش والمشروبات الغازية، وتقضي معظم وقتها جالسة على الكنبة وممسكة هاتفها، وما عندها أي رغبة تعمل أي شيء غير هيك! 😴<br><br><b>لا تكن كتفوحة الكسولة!</b></div>'+btn('bk','الرجوع للصفحة الرئيسية'),function(){on(document.getElementById('bk'),menu)})}
function how(){render('<h1>كيف تلعب</h1><div class="say">مهمتك اختيار عادات صحية ومفيدة لإنقاذ تفوحة من الكسل 💚</div><div class="pair"><div class="pc">'+solo('tired')+'<div class="cap">كسلانة 😴</div></div><div class="pc">'+solo('happy')+'<div class="cap">نشيطة 💪</div></div></div><div class="say">اختاري الإجابة الصح في كل سؤال لتتحول تفوحة من الكسولة إلى النشيطة!</div>'+btn('bk','الرجوع للصفحة الرئيسية'),function(){on(document.getElementById('bk'),menu)})}
function start(){i=0;wrong=0;good=0;show()}
function show(){var d=Q[i];
 render(bar(en(good))+stage(d.img,'',d.items)+'<div class="say cloud">'+d.s+'</div><div class="q"><h2>'+d.q+'</h2>'+
 d.o.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+(d.oi?'<img src="'+ITEM[d.oi[k]]+'" alt="">':'')+'<span>'+o[0]+'</span></button>'}).join('')+'</div>',function(){
 A.querySelectorAll('.opt').forEach(function(b){on(b,function(){pick(+b.dataset.k)},false)})})}
function pick(k){var d=Q[i],ok=k===d.c,old=en(good);
 sfx(ok?'right':'wrong');if(ok)good++;
 var img=ok?'happy':(wrong++%2?'think':'surprised');
 var pr=d.oi?[d.oi[k]]:(d.fi&&d.fi[k]?[d.fi[k]]:null);
 render(bar(old)+stage(img,'',pr)+'<div class="fb '+(ok?'ok':'no')+'">'+d.o[k][1]+'</div>'+
 '<button class="btn" id="nx">'+(ok?'التالي':'جرّبي مرة ثانية')+'</button>',function(){
 setEn(en(good));on(document.getElementById('nx'),function(){if(ok){i++;i<Q.length?show():end()}else show()})})}
function end(){render(bar(en(Q.length-1))+stage('happy','')+
 '<div class="say cloud">تفوحة: صحتي هي حقي! 🍎</div><div class="q"><h2>صحتك حقك 💚🍎</h2><p>ساعدت تفوحة تتعرف على عادات صحية جديدة، وهسا إجا دورك! لأن التغيير مش صعب، وخطوة صغيرة كل يوم بتفرق وبتساعدك تبني عادات صحية أفضل.</p><p><b>جاهز تبدأ تحديك بالحياة الحقيقية؟</b></p></div>'+
 btn('again','للعب مجددًا أنقر هنا')+btn('home','الرجوع للصفحة الرئيسية'),function(){setEn(100);sfx('right');on(document.getElementById('again'),start);on(document.getElementById('home'),menu)})}
menu();
</script></body></html>
